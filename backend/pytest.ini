[pytest]
asyncio_mode = auto
# Auto-retry tests that fail due to Mongo's `AutoReconnect: connection closed`
# transient — see tests/router_test_utils.py for the root-cause analysis.
# Most tests pass on the first try; flaky ones retry up to 2x with 0.5s delay.
addopts = --reruns 2 --reruns-delay 0.5 --only-rerun AutoReconnect --only-rerun "connection closed" --only-rerun OSError
