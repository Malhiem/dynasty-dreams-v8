# Apply with -f docker-compose.h2h.yml -f docker-compose.scheduler.yml
# Always use a distinct disposable Compose project, never the shared preview.
services:
  mongo:
    command: ["mongod", "--replSet", "scheduler-rs", "--bind_ip_all"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status(); } catch (e) { rs.initiate({_id:'scheduler-rs',members:[{_id:0,host:'mongo:27017'}]}); } if (!db.hello().isWritablePrimary) quit(1);"
      interval: 2s
      timeout: 5s
      retries: 30
  backend:
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017/?replicaSet=scheduler-rs
